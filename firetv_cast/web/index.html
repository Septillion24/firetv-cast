<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101114">
<title>TV Remote</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='2' y='5' width='28' height='19' rx='3' fill='%23ff9f43'/%3E%3Cpath d='M13 10l7 4.5-7 4.5z' fill='%23101114'/%3E%3Crect x='10' y='26' width='12' height='2' rx='1' fill='%23ff9f43'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #f4f2ee; --card: #ffffff; --text: #1b1c1f; --muted: #6d6f76; --line: #e3e0da;
    --accent: #e8711a; --accent-text: #ffffff; --press: #efece6; --danger: #c43c3c;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #101114; --card: #1a1b20; --text: #f1f1f3; --muted: #8b8d96; --line: #2a2c33;
            --accent: #ff9f43; --accent-text: #101114; --press: #24262d; --danger: #ff6b6b; }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 16px 16px calc(32px + env(safe-area-inset-bottom)); }
  .player { position: sticky; top: 0; z-index: 2; background: var(--bg); padding-top: 4px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 18px; }
  .state { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .dot.on { background: #3fbf6f; } .dot.off { background: var(--danger); }
  .dot.loading { width: 12px; height: 12px; background: transparent; border: 2px solid var(--accent);
                 border-right-color: transparent; animation: spin 0.7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .title { font-size: 19px; font-weight: 650; margin: 8px 0 14px; min-height: 1.4em;
           overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  input[type=range] { width: 100%; accent-color: var(--accent); height: 28px; margin: 0; }
  .times { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted);
           font-variant-numeric: tabular-nums; }
  .row { display: flex; align-items: center; justify-content: center; gap: 12px; margin-top: 12px; }
  button { font: inherit; color: var(--text); background: var(--press); border: 0; border-radius: 14px;
           min-width: 52px; height: 52px; padding: 0 14px; cursor: pointer; display: inline-flex;
           align-items: center; justify-content: center; gap: 4px; font-size: 14px; font-weight: 600; }
  button { position: relative; }
  button:active { transform: scale(0.96); }
  button.busy > * { visibility: hidden; }
  button.busy::after { content: ""; position: absolute; inset: 0; margin: auto; width: 20px; height: 20px;
                       border-radius: 50%; border: 2.5px solid currentColor; border-right-color: transparent;
                       animation: spin 0.7s linear infinite; }
  button.big.busy::after { width: 28px; height: 28px; border-width: 3px; }
  button:disabled { opacity: 0.4; }
  button.big { width: 72px; height: 72px; border-radius: 50%; background: var(--accent); color: var(--accent-text); }
  button svg { width: 24px; height: 24px; fill: currentColor; }
  button.big svg { width: 32px; height: 32px; }
  .vol { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line); }
  .vol { justify-content: space-between; }
  .vol button { flex: 1; min-width: 0; padding: 0; }
  .message { margin-top: 12px; font-size: 14px; color: var(--danger); min-height: 1em; }
  .list-head { display: flex; align-items: center; gap: 10px; margin: 12px 2px 10px; }
  .link-row { margin-top: 22px; margin-bottom: 0; }
  .list-head input { flex: 1; min-width: 0; font: inherit; color: var(--text); background: var(--card);
                     border: 1px solid var(--line); border-radius: 12px; padding: 11px 14px; }
  .link-row button { height: 46px; background: var(--accent); color: var(--accent-text); }
  ul { list-style: none; margin: 0; padding: 0; }
  li { display: flex; align-items: center; gap: 10px; padding: 10px 6px 10px 14px; border-radius: 14px; }
  li + li { border-top: 1px solid var(--line); }
  li.current { background: var(--card); }
  li .info { flex: 1; min-width: 0; cursor: pointer; }
  li .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 550; }
  li .meta { font-size: 13px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  button.on { background: var(--accent); color: var(--accent-text); }
  li button { min-width: 44px; height: 44px; background: transparent; }
  li button.play { color: var(--accent); }
  .empty { color: var(--muted); text-align: center; padding: 30px 0; }
</style>
</head>
<body>
<main>
  <section class="player">
    <div class="card">
      <div class="state"><span class="dot" id="dot"></span><span id="state">Connecting</span></div>
      <div class="title" id="title">Nothing playing</div>
      <input type="range" id="seek" min="0" max="1000" value="0" step="1" aria-label="Position">
      <div class="times"><span id="pos">0:00</span><span id="dur">0:00</span></div>
      <div class="row">
        <button data-action="back" aria-label="Back 10 seconds">
          <svg viewBox="0 0 24 24"><path d="M12 5V2L7 6l5 4V7a6 6 0 1 1-6 6H4a8 8 0 1 0 8-8z"/></svg><span>10</span></button>
        <button class="big" id="toggle" aria-label="Play or pause">
          <svg viewBox="0 0 24 24" id="toggle-icon"><path d="M8 5v14l11-7z"/></svg></button>
        <button data-action="forward" aria-label="Forward 30 seconds"><span>30</span>
          <svg viewBox="0 0 24 24"><path d="M12 5V2l5 4-5 4V7a6 6 0 1 0 6 6h2a8 8 0 1 1-8-8z"/></svg></button>
      </div>
      <div class="row vol">
        <button data-action="vol-down" aria-label="Volume down"><svg viewBox="0 0 24 24"><path d="M5 11h14v2H5z"/></svg></button>
        <button data-action="mute" aria-label="Mute"><svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.6 3 2.7-2.7-1.4-1.4-2.7 2.7-2.7-2.7-1.4 1.4 2.7 2.7-2.7 2.7 1.4 1.4 2.7-2.7 2.7 2.7 1.4-1.4z"/></svg></button>
        <button data-action="vol-up" aria-label="Volume up"><svg viewBox="0 0 24 24"><path d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6z"/></svg></button>
        <button data-action="headphones" id="headphones" aria-label="Headphones" title="Sound to headphones">
          <svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 0 0-9 9v7a2 2 0 0 0 2 2h2a1 1 0 0 0 1-1v-6a1 1 0 0 0-1-1H5a7 7 0 0 1 14 0h-2a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h2a2 2 0 0 0 2-2v-7a9 9 0 0 0-9-9z"/></svg></button>
        <button data-action="stop" aria-label="Stop"><svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/></svg></button>
      </div>
      <div class="message" id="message"></div>
    </div>
  </section>
  <form class="list-head link-row" id="link-form">
    <input id="link" type="url" inputmode="url" autocomplete="off" placeholder="Paste a video link (YouTube and more)"
           aria-label="Video link">
    <button id="link-play" aria-label="Play link on TV"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></button>
  </form>
  <div class="list-head"><input id="filter" type="search" placeholder="Search" aria-label="Search videos"></div>
  <ul id="list"></ul>
</main>
<script>
const $ = (id) => document.getElementById(id);
const PLAY = '<path d="M8 5v14l11-7z"/>';
const PAUSE = '<path d="M6 5h4v14H6zm8 0h4v14h-4z"/>';
let status = {};
let items = [];
let dragging = false;
let pending = null;

function fmt(s) {
  if (typeof s !== "number" || !isFinite(s)) return "0:00";
  s = Math.max(0, Math.floor(s));
  const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), sec = String(s % 60).padStart(2, "0");
  return h ? `${h}:${String(m).padStart(2, "0")}:${sec}` : `${m}:${sec}`;
}

function size(bytes) {
  return bytes > 1e9 ? (bytes / 1e9).toFixed(1) + " GB" : Math.round(bytes / 1e6) + " MB";
}

function ago(t) {
  const d = (Date.now() / 1000 - t) / 86400;
  if (d < 1) return "today";
  if (d < 2) return "yesterday";
  if (d < 30) return Math.floor(d) + " days ago";
  return new Date(t * 1000).toLocaleDateString();
}

async function api(path, body) {
  const res = await fetch(path, body === undefined ? {} :
    { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  const data = await res.json();
  if (!res.ok || data.ok === false) throw new Error(data.message || "Something went wrong");
  return data;
}

// Runs an action, spinning `button` until the TV has caught up (`done` returns true for a status).
// `late` is shown when the TV never catches up. A newer waiting action replaces an older one.
let latest = 0;
async function act(path, body = {}, button = null, done = null, expect = null, late = null) {
  const id = done ? ++latest : latest;
  const current = () => id === latest;
  $("message").textContent = "";
  button?.classList.add("busy");
  if (expect) { pending = { expect }; render(status); }
  try {
    const data = await api("/api/" + path, body);
    if (data.status && current()) render(data.status);
    if (done && !(await waitFor(done, late ? 25000 : 15000, current)) && late && current()) {
      $("message").textContent = late;
    }
  } catch (e) {
    if (current()) $("message").textContent = e.message;
  } finally {
    button?.classList.remove("busy");
    if (expect && current()) pending = null;
    render(status);
  }
}

async function waitFor(done, timeout, current) {
  const end = Date.now() + timeout;
  while (Date.now() < end && current() && !done(status)) {
    await new Promise((r) => setTimeout(r, 300));
    try { render(await api("/api/status")); } catch (e) { /* keep waiting */ }
  }
  return done(status);
}

const settled = (s) => s.state !== "buffering";

function render(s) {
  status = s;
  const view = pending ? { ...s, ...pending.expect } : s;
  const offline = view.state === "offline";
  const failed = view.state === "error";
  const ours = !!view.title;
  const loading = view.state === "buffering";
  $("dot").className = "dot " + (offline || failed ? "off" : loading ? "loading" : "on");
  $("state").textContent = offline ? "TV not reachable" :
    { playing: "Playing", paused: "Paused", buffering: "Loading", error: "Couldn't play" }[view.state] || "TV ready";
  $("title").textContent = ours ? view.title : "Nothing playing";
  s = view;
  if ((offline || failed) && s.message) $("message").textContent = s.message;
  else if (["Can't reach", "Lost", "The TV couldn't"].some((m) => $("message").textContent.startsWith(m))) {
    $("message").textContent = "";
  }
  $("toggle-icon").innerHTML = s.state === "playing" || s.state === "buffering" ? PAUSE : PLAY;
  const dur = s.duration || 0;
  if (!dragging) {
    $("seek").value = dur ? Math.round((s.position || 0) / dur * 1000) : 0;
    $("pos").textContent = fmt(s.position);
  }
  $("dur").textContent = fmt(dur);
  $("seek").disabled = !ours || !dur;
  $("headphones").classList.toggle("on", !!view.headphones);
  document.querySelectorAll("li").forEach((li) => li.classList.toggle("current", ours && li.dataset.name === s.title));
}

function renderList() {
  const q = $("filter").value.trim().toLowerCase();
  const shown = items.filter((i) => !q || i.name.toLowerCase().includes(q));
  $("list").innerHTML = "";
  if (!shown.length) {
    $("list").innerHTML = `<div class="empty">${items.length ? "No matches" : "No videos found"}</div>`;
    return;
  }
  for (const item of shown) {
    const li = document.createElement("li");
    li.dataset.name = item.name.replace(/\.[^.]+$/, "");
    li.innerHTML = `<div class="info"><div class="name"></div><div class="meta"></div></div>
      <button class="convert" aria-label="Play converted (if it won't play)" title="Play converted (if it won't play)">
        <svg viewBox="0 0 24 24"><path d="M12 4V1L8 5l4 4V6a6 6 0 0 1 5.6 8.2l1.5 1.5A8 8 0 0 0 12 4zm0 14a6 6 0 0 1-5.6-8.2L4.9 8.3A8 8 0 0 0 12 20v3l4-4-4-4z"/></svg></button>
      <button class="play" aria-label="Play on TV"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></button>`;
    li.querySelector(".name").textContent = item.name;
    li.querySelector(".meta").textContent = `${size(item.size)} · ${ago(item.modified)}${item.folder ? " · " + item.folder : ""}`;
    const title = li.dataset.name;
    const started = (s) => s.title === title && ["playing", "paused", "error"].includes(s.state);
    const loading = { title, state: "buffering", position: 0, duration: 0 };
    const late = "The TV didn't start this video. Tap it again.";
    const play = () => act("play", { id: item.id }, li.querySelector(".play"), started, loading, late);
    li.querySelector(".info").onclick = play;
    li.querySelector(".play").onclick = play;
    li.querySelector(".convert").onclick = () =>
      act("play", { id: item.id, convert: true }, li.querySelector(".convert"), started, loading, late);
    $("list").appendChild(li);
  }
  render(status);
}

async function loadList() {
  try {
    items = (await api("/api/library")).items;
    renderList();
  } catch (e) {
    $("message").textContent = e.message;
  }
}

async function poll() {
  if (!document.hidden && !pending) {
    try { render(await api("/api/status")); } catch (e) { /* server restarting */ }
  }
  setTimeout(poll, 1000);
}

$("toggle").onclick = () => {
  const playing = status.state === "playing" || status.state === "buffering";
  $("toggle-icon").innerHTML = playing ? PLAY : PAUSE;
  act(playing ? "pause" : "resume", {}, $("toggle"), (s) => s.state === (playing ? "paused" : "playing"));
};
document.querySelectorAll("[data-action]").forEach((b) => b.onclick = () => ({
  back: () => act("seek", { delta: -10 }, b, settled),
  forward: () => act("seek", { delta: 30 }, b, settled),
  "vol-up": () => act("volume", { action: "up", steps: 2 }, b),
  "vol-down": () => act("volume", { action: "down", steps: 2 }, b),
  mute: () => act("volume", { action: "mute" }, b),
  stop: () => act("stop", {}, b, (s) => !s.title),
  headphones: () => {
    const on = !status.headphones;
    if (on) $("message").textContent = "";
    act("headphones", { on }, b, (s) => !!s.headphones === on);
  },
})[b.dataset.action]());
$("seek").oninput = () => {
  dragging = true;
  $("pos").textContent = fmt($("seek").value / 1000 * (status.duration || 0));
};
$("seek").onchange = async () => {
  const position = $("seek").value / 1000 * (status.duration || 0);
  await act("seek", { position }, null, settled, { state: "buffering", position });
  dragging = false;
};
$("filter").oninput = renderList;
$("link-form").onsubmit = async (e) => {
  e.preventDefault();
  const url = $("link").value.trim();
  if (!url) return;
  const started = (s) => s.link === url && ["playing", "paused", "error"].includes(s.state);
  await act("play", { url }, $("link-play"), started,
    { title: "Opening link…", state: "buffering", position: 0, duration: 0 }, "The TV didn't start this video. Try again.");
  if (status.link === url) $("link").value = "";
};
document.addEventListener("visibilitychange", () => { if (!document.hidden) loadList(); });

loadList();
poll();
</script>
</body>
</html>
