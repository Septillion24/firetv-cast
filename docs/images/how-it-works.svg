<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" role="img" aria-labelledby="t d">
  <title id="t">How Send to TV works</title>
  <desc id="d">A phone or right-click menu tells the server on your PC what to play. The PC streams the video over HTTP to VLC on the Fire TV and controls VLC over adb.</desc>
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ff9f43"/>
    </marker>
    <style>
      text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #f1f1f3; }
      .box { fill: #1a1b20; stroke: #2f3139; stroke-width: 1.5; }
      .hot { fill: #1a1b20; stroke: #ff9f43; stroke-width: 2; }
      .h { font-size: 19px; font-weight: 650; }
      .s { font-size: 14px; fill: #a3a5ae; }
      .lbl { font-size: 13px; fill: #ff9f43; font-weight: 600; }
      .arrow { stroke: #ff9f43; stroke-width: 2.5; fill: none; marker-end: url(#head); }
    </style>
  </defs>
  <rect width="900" height="330" rx="18" fill="#101114"/>

  <rect class="box" x="30" y="40" width="200" height="100" rx="14"/>
  <text class="h" x="130" y="82" text-anchor="middle">Your phone</text>
  <text class="s" x="130" y="106" text-anchor="middle">remote page, Share button</text>

  <rect class="box" x="30" y="190" width="200" height="100" rx="14"/>
  <text class="h" x="130" y="232" text-anchor="middle">Your PC</text>
  <text class="s" x="130" y="256" text-anchor="middle">right-click menu, tv command</text>

  <rect class="hot" x="320" y="40" width="260" height="250" rx="14"/>
  <text class="h" x="450" y="80" text-anchor="middle">Send to TV server</text>
  <text class="s" x="450" y="104" text-anchor="middle">runs on your PC</text>
  <text class="s" x="450" y="150" text-anchor="middle">serves your files, seekable</text>
  <text class="s" x="450" y="176" text-anchor="middle">yt-dlp finds YouTube streams</text>
  <text class="s" x="450" y="202" text-anchor="middle">ffmpeg converts what VLC can't play</text>
  <text class="s" x="450" y="228" text-anchor="middle">adb presses the TV's buttons</text>

  <rect class="box" x="670" y="40" width="200" height="250" rx="14"/>
  <text class="h" x="770" y="140" text-anchor="middle">Fire TV</text>
  <text class="s" x="770" y="166" text-anchor="middle">VLC for Fire plays</text>
  <text class="s" x="770" y="188" text-anchor="middle">the stream</text>

  <path class="arrow" d="M230 90 H316"/>
  <path class="arrow" d="M230 240 H316"/>
  <path class="arrow" d="M580 110 H666"/>
  <text class="lbl" x="623" y="98" text-anchor="middle">video (HTTP)</text>
  <path class="arrow" d="M580 220 H666" stroke-dasharray="7 6"/>
  <text class="lbl" x="623" y="244" text-anchor="middle">control (adb)</text>
</svg>
